<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — North Shore Emergency Association</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('nsea-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root, html[data-theme="dark"] {
    --navy: #0d1b2a; --amber: #f5a623; --text: #e8eef4; --muted: #9db2c4;
    --card: #16304a; --border: rgba(157, 178, 196, 0.18);
    --btn-fg: #0d1b2a; --btn-hover: #ffb63a;
  }
  html[data-theme="light"] {
    --navy: #f4f7fa; --amber: #a65f00; --text: #0f2133; --muted: #4c6379;
    --card: #ffffff; --border: rgba(15, 33, 51, 0.14);
    --btn-fg: #ffffff; --btn-hover: #8a4f00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Barlow', sans-serif; background: var(--navy); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  a { color: var(--amber); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .card {
    max-width: 520px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 48px 36px;
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    letter-spacing: 0.03em; text-transform: uppercase; font-size: 1.9rem;
    color: var(--amber); margin-bottom: 14px;
  }
  p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  .btn {
    display: inline-block; margin-top: 28px; padding: 12px 26px;
    background: var(--amber); color: var(--btn-fg); font-weight: 700;
    border-radius: 8px; letter-spacing: 0.02em;
  }
  .btn:hover { text-decoration: none; background: var(--btn-hover); }
</style>
</head>
<body>
  <div class="card">
    <h1>Message Sent</h1>
    <p>Thanks for reaching out to NSEA. Your message was delivered to <b>membership@nsea.com</b> and someone will get back to you soon.</p>
    <a class="btn" href="index.html">&larr; Back to Home</a>
  </div>
</body>
</html>
